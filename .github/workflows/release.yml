name: Build and release

on:
  schedule:
    # every Monday 04:00 UTC — picks up new neo releases automatically
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      neo_tag:
        description: "neo tag to build (e.g. v0.6.1). Empty = latest release."
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["build/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  neo:
    # ubuntu-24.04, NOT ubuntu-latest: newer runner images ship the amd64v3
    # archive variant, whose prebuilt static glibc is compiled for x86-64-v3 —
    # linking it would SIGILL these baseline binaries on older CPUs even with
    # the compiler shim in build-neo.sh. Noble's archive is plain x86-64-v1.
    runs-on: ubuntu-24.04
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve neo version
        id: ver
        run: |
          TAG="${{ inputs.neo_tag }}"
          if [ -z "$TAG" ]; then
            # Authenticate: unauthenticated api.github.com calls from shared
            # runner IPs hit the 60 req/hr rate limit (403 -> empty tag ->
            # a confusing 404 two steps later). github.token = 5000 req/hr.
            TAG="$(curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/st3w/neo/releases/latest | jq -r .tag_name)"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve latest neo tag (API rate limit or outage?)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # v0.6.1 -> 0.6.1
          VER="${TAG#v}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make libncurses-dev file >/dev/null

      - name: Build static neo AppImage
        run: bash build/build-neo.sh "${{ steps.ver.outputs.tag }}"

      - name: Self-test
        run: bash build/self-test-neo.sh dist/neo-x86_64.AppImage

      - name: Baseline-ISA gate (x86-64-v1 via qemu)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static >/dev/null
          ./dist/neo-x86_64.AppImage --appimage-extract >/dev/null
          # The extracted inner binary runs under an emulated baseline v1 CPU:
          # any v2+ instruction (from our code OR prebuilt static glibc) dies
          # with SIGILL and blocks the release.
          EMU_PREFIX="qemu-x86_64-static -cpu qemu64" \
            bash build/self-test-neo.sh squashfs-root/usr/bin/neo

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/neo-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [neo]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum neo-x86_64.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release (pkgforge-style versioned tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.neo.outputs.ver }}
        run: |
          TAG="${VER}@$(date -u +%F)_$(date -u +%s)"
          cat > notes.md <<EOF
          Unofficial, fully static AppImage of **neo ${VER}** — the Matrix-style
          digital rain for the terminal (a CMatrix clone with 32-bit color and
          Unicode support, by Stewart Reive). No system libraries needed — runs
          on any x86_64 Linux regardless of distribution or glibc age, even
          without FUSE (the terminfo database ships inside the image).

          ## Install with am / appman
          \`\`\`
          am -e https://github.com/${{ github.repository }} neo neo
          \`\`\`

          ## Or grab directly (stable URL)
          \`\`\`
          curl -LO https://github.com/${{ github.repository }}/releases/latest/download/neo-x86_64.AppImage
          chmod +x neo-x86_64.AppImage
          \`\`\`

          ## Try it
          \`\`\`
          ./neo-x86_64.AppImage -m "Wake up..."      # center-screen message
          ./neo-x86_64.AppImage -f 30                # cap the frame rate
          \`\`\`
          Quit with **q**. All options: \`./neo-x86_64.AppImage --help\`.

          Built and functionally self-tested in CI on every release, including
          under an emulated baseline x86-64-v1 CPU so it runs on older hardware.
          See SHA256SUMS.txt for checksums. Neither this build nor neo itself is
          affiliated with "The Matrix", Warner Bros. Entertainment Inc. or
          Village Roadshow Pictures.
          EOF
          gh release create "$TAG" \
            dist/neo-x86_64.AppImage \
            dist/SHA256SUMS.txt \
            --title "neo: ${VER}" \
            --notes-file notes.md \
            --latest
